<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SageX AI Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- ES Module Shims for older browser compatibility -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #020205; color: white; font-family: 'Inter', system-ui, sans-serif; touch-action: none; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Space Grotesk', sans-serif; }
        #root { width: 100%; height: 100%; position: relative; }
        
        /* Cosmic Glassmorphism Classes */
        .glass-panel {
            background: rgba(15, 15, 30, 0.6) !important;
            backdrop-filter: blur(24px) !important;
            -webkit-backdrop-filter: blur(24px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
        }
        .glass-panel-dark {
            background: rgba(5, 5, 10, 0.7) !important;
            backdrop-filter: blur(30px) !important;
            -webkit-backdrop-filter: blur(30px) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5) !important;
        }
        .gradient-border {
            position: relative;
            background: rgba(15, 15, 30, 0.6);
            backdrop-filter: blur(24px);
            border-radius: 16px;
            z-index: 1;
        }
        .gradient-border::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            background: linear-gradient(45deg, #00f2ff, #ff00ff, #00f2ff);
            background-size: 200% 200%;
            animation: gradientMove 3s ease infinite;
            z-index: -1;
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }
        .gradient-border:hover::before {
            opacity: 1;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .glow-button {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
        }
        .glow-button:hover {
            transform: translateY(-2px) scale(1.02) !important;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.5) !important;
        }
        .glow-button:active {
            transform: translateY(1px) scale(0.98) !important;
        }
        .smooth-transition {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
        }
        
        /* Debug Console for Mobile */
        #debug-console {
            display: none; /* Hidden by default, shown via JS if error occurs */
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); color: #ff4444; z-index: 99999;
            padding: 20px; font-family: monospace; font-size: 12px;
            overflow: auto; white-space: pre-wrap; pointer-events: auto;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 255, 0.3); border-radius: 2px; }

        /* Header */
        .responsive-header {
            position: absolute; top: 0; left: 0; right: 0; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            z-index: 10;
        }
        .header-left h1 { font-size: 1.5rem; margin: 0; white-space: nowrap; text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .header-left p { margin: 2px 0 0 0; font-size: 0.7rem; color: rgba(255,255,255,0.6); letter-spacing: 2px; text-transform: uppercase; }
        .header-right { display: flex; gap: 8px; align-items: center; }

        /* Small Header Buttons */
        .header-sm-btn {
            padding: 5px 12px !important;
            font-size: 0.75rem !important;
            border-radius: 16px !important;
            height: 28px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            transition: all 0.2s;
            font-weight: 600;
        }
        .header-sm-btn:hover { transform: translateY(-1px); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
        .header-sm-btn:active { transform: scale(0.95); }
        
        @media (max-width: 600px) {
            .responsive-header { 
                padding: 10px 12px; 
                flex-direction: column; 
                align-items: center; 
                gap: 8px; 
                background: rgba(0,0,0,0.6); 
                backdrop-filter: blur(4px); 
            }
            .header-left h1 { font-size: 1.3rem; }
            .header-right { 
                justify-content: center; 
                width: 100%; 
                flex-wrap: wrap; 
                gap: 8px;
            }
            .header-right button { flex: 0 1 auto; margin: 0; }
        }

        /* Navigation Bar */
        .nav-bar {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; padding: 6px;
            background: rgba(10, 10, 20, 0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 40px;
            z-index: 20; pointer-events: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .nav-item {
            padding: 8px 16px; border-radius: 30px; border: none;
            background: transparent; color: rgba(255, 255, 255, 0.5);
            font-weight: 600; cursor: pointer; transition: all 0.3s;
            font-size: 0.85rem; white-space: nowrap;
        }
        .nav-item:hover { color: white; background: rgba(255, 255, 255, 0.05); }
        .nav-item.active { background: #00f2ff; color: black; box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); }

        @media (max-width: 600px) {
            .nav-bar { width: 90%; justify-content: space-between; bottom: 20px; }
            .nav-item { padding: 8px 4px; font-size: 0.75rem; flex: 1; text-align: center; }
        }

        /* Directory Mode - Beautiful Cards */
        .directory-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 100;
            padding: 110px 20px 100px; overflow-y: auto;
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px; align-content: start;
            animation: fadeIn 0.4s ease-out;
        }
        
        .directory-card {
            background: rgba(20, 24, 35, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; 
            padding: 24px; 
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            position: relative; overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        /* Highlight effect on hover */
        .directory-card:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(30, 35, 50, 0.8);
            border-color: rgba(0, 242, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0, 242, 255, 0.2);
        }

        .directory-icon { 
            font-size: 4rem; 
            margin-bottom: 16px; 
            /* White glow to ensure dark emojis are visible on dark background */
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            transition: transform 0.3s; z-index: 2;
            color: #fff;
        }
        .directory-card:hover .directory-icon { transform: scale(1.1); text-shadow: 0 0 20px rgba(0, 242, 255, 0.8); }

        .directory-card h3 { 
            margin: 0 0 8px; 
            color: #ffffff; /* Bright White Text */
            font-size: 1.4rem; font-weight: 800; letter-spacing: 1px; z-index: 2;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(0, 242, 255, 0.5); /* Cyan glow */
        }
        .directory-card p { 
            margin: 0; 
            color: #ffffff; /* Star White */
            font-size: 0.9rem; line-height: 1.5; z-index: 2;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        .directory-btn {
            margin-top: 20px; z-index: 2;
            background: transparent; 
            color: #00f2ff;
            padding: 10px 24px; border-radius: 20px;
            font-size: 0.85rem; font-weight: bold;
            border: 1px solid #00f2ff;
            transition: all 0.3s;
        }
        .directory-card:hover .directory-btn { background: #00f2ff; color: #000; box-shadow: 0 0 15px rgba(0, 242, 255, 0.6); }

        /* ═══════════════ NEW DIRECTORY LANDING PAGE ═══════════════ */
        .directory-overlay-new {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; overflow-y: auto; overflow-x: hidden;
            animation: fadeIn 0.4s ease-out;
            scrollbar-width: thin; scrollbar-color: rgba(0,242,255,0.3) transparent;
        }
        .directory-overlay-new::-webkit-scrollbar { width: 4px; }
        .directory-overlay-new::-webkit-scrollbar-track { background: transparent; }
        .directory-overlay-new::-webkit-scrollbar-thumb { background: rgba(0,242,255,0.3); border-radius: 2px; }

        /* ── Nav ── */
        .dir-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 110;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.3s;
        }
        .dir-nav-inner {
            max-width: 1200px; margin: 0 auto; display: flex; align-items: center;
            justify-content: space-between; padding: 14px 24px;
        }
        .dir-logo {
            display: flex; align-items: center; gap: 8px; text-decoration: none;
            color: #fff; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px;
        }
        .dir-logo span { font-family: 'Space Grotesk', sans-serif; }
        .dir-nav-links {
            list-style: none; display: flex; gap: 32px; margin: 0; padding: 0;
        }
        .dir-nav-links a {
            text-decoration: none; color: rgba(255,255,255,0.5); font-size: 0.9rem;
            transition: color 0.2s; font-weight: 500;
        }
        .dir-nav-links a:hover { color: #fff; }
        .dir-nav-cta {
            background: #fff; color: #000; border: none; padding: 8px 22px;
            border-radius: 999px; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
        }
        .dir-nav-cta:hover { box-shadow: 0 0 24px rgba(255,255,255,0.25); transform: scale(1.05); }
        .dir-nav-cta:active { transform: scale(0.95); }

        @media (max-width: 768px) {
            .dir-nav-links { display: none; }
            .dir-nav-inner { padding: 12px 16px; }
        }

        /* ── Hero ── */
        .dir-hero {
            position: relative; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; overflow: hidden; padding-top: 60px;
        }
        .dir-hero-glow {
            position: absolute; width: 700px; height: 700px; border-radius: 50%; pointer-events: none;
        }
        .dir-hero-glow-l { top: -200px; left: -200px; background: radial-gradient(circle, rgba(0,242,255,0.15) 0%, transparent 70%); }
        .dir-hero-glow-r { bottom: -300px; right: -200px; background: radial-gradient(circle, rgba(123,47,247,0.12) 0%, transparent 70%); }
        .dir-hero-content {
            position: relative; z-index: 2; max-width: 800px; padding: 0 24px;
            text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px;
        }
        .dir-pill {
            display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px;
            border-radius: 999px; border: 1px solid rgba(0,242,255,0.3);
            background: rgba(0,242,255,0.05); font-size: 0.8rem; font-weight: 500;
            color: #00f2ff;
        }
        .dir-hero-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900; line-height: 1.05;
            letter-spacing: -2px; color: #fff; margin: 0;
        }
        .dir-gradient-text {
            background: linear-gradient(to right, #00f2ff, #7b2ff7); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
        }
        .dir-gradient-text-purple {
            background: linear-gradient(to right, #7b2ff7, #00f2ff); -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; background-clip: text;
        }
        .dir-hero-sub {
            font-size: 1.1rem; color: rgba(255,255,255,0.45); max-width: 600px;
            line-height: 1.7; margin: 0;
        }
        .dir-hero-ctas { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
        .dir-btn-primary {
            display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px;
            border-radius: 999px; background: #fff; color: #000; border: none;
            font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.3s;
        }
        .dir-btn-primary:hover { box-shadow: 0 0 32px rgba(255,255,255,0.2); transform: scale(1.05); }
        .dir-btn-primary:active { transform: scale(0.95); }
        .dir-btn-secondary {
            display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px;
            border-radius: 999px; background: transparent; color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.2); font-size: 0.9rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s; backdrop-filter: blur(4px);
        }
        .dir-btn-secondary:hover { border-color: rgba(255,255,255,0.4); color: #fff; transform: scale(1.05); }
        .dir-scroll-indicator {
            position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
        }
        .dir-scroll-indicator div {
            width: 20px; height: 32px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2);
            display: flex; justify-content: center; padding-top: 6px;
        }
        .dir-scroll-dot {
            width: 4px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.4);
            animation: dirScrollBounce 2s ease-in-out infinite;
        }
        @keyframes dirScrollBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

        /* Floating shapes */
        .dir-float-shape {
            position: absolute; opacity: 0.15;
            animation: dirFloat 6s ease-in-out infinite;
        }
        @keyframes dirFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-16px) rotate(8deg); }
        }

        /* ── Stats ── */
        .dir-stats {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
            max-width: 900px; margin: 0 auto; padding: 48px 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .dir-stat-item { text-align: center; }
        .dir-stat-value { font-size: 2rem; font-weight: 800; color: #fff; margin-top: 4px; }
        .dir-stat-label { font-size: 0.75rem; color: rgba(255,255,255,0.35); margin-top: 4px; }
        @media (max-width: 600px) {
            .dir-stats { grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 32px 16px; }
            .dir-stat-value { font-size: 1.5rem; }
        }

        /* ── Section shared ── */
        .dir-section-header { text-align: center; margin-bottom: 48px; }
        .dir-section-pill {
            display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px;
            border-radius: 999px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); font-size: 0.75rem; font-weight: 500;
            color: rgba(255,255,255,0.5); margin-bottom: 16px;
        }
        .dir-section-title {
            font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; color: #fff;
            margin: 0; letter-spacing: -1px;
        }

        /* ── Features ── */
        .dir-features {
            padding: 80px 24px; max-width: 1200px; margin: 0 auto;
        }
        .dir-features-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
        }
        .dir-feature-card {
            background: rgba(255,255,255,0.03); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            padding: 32px; cursor: pointer; transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .dir-feature-card:hover {
            border-color: rgba(0,242,255,0.3); transform: translateY(-4px) scale(1.02);
            box-shadow: 0 0 40px rgba(0,242,255,0.06);
        }
        .dir-feature-icon {
            width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
            border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); margin-bottom: 20px;
        }
        .dir-feature-card h3 { font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0 0 8px; }
        .dir-feature-card p {
            font-size: 0.9rem; color: rgba(255,255,255,0.4); line-height: 1.6; margin: 0;
        }
        .dir-feature-link {
            margin-top: 20px; font-size: 0.8rem; font-weight: 600; color: #00f2ff;
            display: inline-flex; align-items: center; gap: 4px;
            opacity: 0; transition: opacity 0.3s;
        }
        .dir-feature-card:hover .dir-feature-link { opacity: 1; }
        @media (max-width: 768px) {
            .dir-features-grid { grid-template-columns: 1fr; }
            .dir-features { padding: 48px 16px; }
        }

        /* ── Showcase ── */
        .dir-showcase {
            padding: 80px 24px; position: relative; overflow: hidden; max-width: 1200px; margin: 0 auto;
        }
        .dir-showcase-glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 600px; height: 600px; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, rgba(0,242,255,0.06) 0%, transparent 70%);
        }
        .dir-showcase-frame {
            position: relative; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); padding: 16px;
            transition: transform 0.5s;
        }
        .dir-showcase-frame:hover {
            transform: perspective(1200px) rotateX(2deg) rotateY(-2deg) scale(1.01);
        }
        .dir-showcase-border-glow {
            position: absolute; inset: -1px; border-radius: 21px;
            background: linear-gradient(135deg, rgba(0,242,255,0.2), rgba(123,47,247,0.2), rgba(0,242,255,0.2));
            opacity: 0; transition: opacity 0.5s; filter: blur(4px); z-index: -1;
        }
        .dir-showcase-frame:hover .dir-showcase-border-glow { opacity: 1; }

        /* ── Pricing ── */
        .dir-pricing {
            padding: 80px 24px; max-width: 1000px; margin: 0 auto;
        }
        .dir-pricing-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
        }
        .dir-pricing-card {
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            background: rgba(255,255,255,0.03); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); padding: 32px;
            position: relative; transition: all 0.3s;
        }
        .dir-pricing-card:hover { transform: scale(1.03); }
        .dir-pricing-highlighted {
            border-color: rgba(0,242,255,0.4); background: rgba(255,255,255,0.06);
            box-shadow: 0 0 60px rgba(0,242,255,0.08);
        }
        .dir-pricing-badge {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            background: #00f2ff; color: #000; padding: 4px 14px; border-radius: 999px;
            font-size: 0.75rem; font-weight: 700;
        }
        .dir-pricing-card h3 { font-size: 1.1rem; font-weight: 700; color: #fff; margin: 0 0 12px; }
        .dir-pricing-amount { display: flex; align-items: baseline; gap: 4px; }
        .dir-pricing-price { font-size: 2.5rem; font-weight: 800; color: #fff; }
        .dir-pricing-period { font-size: 0.85rem; color: rgba(255,255,255,0.35); }
        .dir-pricing-desc { font-size: 0.85rem; color: rgba(255,255,255,0.35); margin: 8px 0 24px; }
        .dir-pricing-features {
            list-style: none; padding: 0; margin: 0 0 32px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .dir-pricing-features li {
            display: flex; align-items: center; gap: 8px; font-size: 0.85rem;
            color: rgba(255,255,255,0.55);
        }
        .dir-pricing-btn {
            width: 100%; padding: 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s; background: transparent;
            border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7);
        }
        .dir-pricing-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; transform: scale(1.05); }
        .dir-pricing-btn-primary {
            background: #fff; color: #000; border: none;
        }
        .dir-pricing-btn-primary:hover { box-shadow: 0 0 24px rgba(255,255,255,0.2); }
        @media (max-width: 768px) {
            .dir-pricing-grid { grid-template-columns: 1fr; }
            .dir-pricing { padding: 48px 16px; }
        }

        /* ── Footer ── */
        .dir-footer {
            border-top: 1px solid rgba(255,255,255,0.05); background: #000; padding: 48px 24px 24px;
        }
        .dir-footer-inner {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 32px;
        }
        .dir-footer-brand p { font-size: 0.85rem; color: rgba(255,255,255,0.3); margin-top: 16px; line-height: 1.7; max-width: 280px; }
        .dir-footer-col h4 { font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.6); margin: 0 0 16px; }

    window.addEventListener('unhandledrejection', function(event) {
       var consoleDiv = document.getElementById('debug-console');
       if(consoleDiv) {

           if (event.reason && event.reason.toString().includes('WebSocket')) {

           }
           consoleDiv.style.display = 'block';

    });
